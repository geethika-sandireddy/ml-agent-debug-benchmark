[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-debug-env"
version = "1.0.0"
description = "OpenEnv-style environment for debugging failing ML training runs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.111.0",
  "uvicorn==0.30.1",
  "pydantic==2.7.1",
  "openai>=2.7.2",
  "openenv-core>=0.2.0",
  "PyYAML==6.0.1",
  "requests==2.32.2",
  "torch>=2.2",
  "scikit-learn>=1.4",
  "numpy>=1.26",
]

[project.scripts]
server = "server.app:main"

[tool.setuptools]
packages = ["env", "server", "sandbox", "grader", "workloads", "baselines"]
